<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Header</title>
    <link
      rel="icon"
      type="image/png"
      href="https://i.postimg.cc/TPxd7803/css.png"
    />

    <!-- Fonts -->
    <link rel="stylesheet" href="../font.css" />
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Mobile Layout -->
    <div class="mobile-layout">
      <!-- Header -->
      <header class="header">
        <div class="header-wrapper">
          <div class="header-text">
            <div class="header-title">Header</div>
            <img
              class="header-title-badge"
              src="https://i.ibb.co/gMWzggJc/b478195eafd3.png"
            />
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main" id="main">
        <!-- Home Page -->
        <div class="home" id="page-home">
          <div class="home-wrapper">
            <!-- Block 1 -->
            <div class="home-blocks block-1">
              <div class="block-1-main">
                <div class="block-1-name">
                  The Freedom<br />
                  Storage Tool
                </div>
                <div class="block-1-tagline">
                  The storage app that let you prepare ahead, saves time,
                  efforts and it corrects
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-wrapper">
          <div class="nav-items">
            <div class="nav-item">
              <img
                class="nav-icon"
                src="https://i.ibb.co/TCgGtGw/112a1f8b84c2.png"
              />
              <div class="nav-title">Home</div>
            </div>
            <div class="nav-item">
              <img
                class="nav-icon"
                src="https://i.ibb.co/F4hz2G3F/10783420eb0d.png"
              />
              <div class="nav-title">Profiles</div>
            </div>
            <div class="nav-item">
              <img
                class="nav-icon"
                src="https://i.ibb.co/1YkWLyPB/b94d39b171a7.png"
              />
              <div class="nav-title">Visuals</div>
            </div>
            <div class="nav-item">
              <img
                class="nav-icon"
                src="https://i.ibb.co/7JMw3ZJN/15f0ff8a2649.png"
              />
              <div class="nav-title2">A&amp;P</div>
            </div>
            <div class="nav-item">
              <img
                class="nav-icon"
                src="https://i.ibb.co/pBgQWjD1/15ccd5161fa8.png"
              />
              <div class="nav-title2">Store</div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Desktop Redirect -->
    <div class="redirect-page">
      <div class="redirect-container">
        <h1 class="redirect-title">504 Error</h1>
        <div class="redirect-text">
          <p class="redirect-subtext">
            This is Currently Unavailable on Tablet and Desktop
          </p>
          <a href="#" class="redirect-cta">View On Mobile</a>
        </div>
      </div>
    </div>

    <script src="style.js"></script>
  </body>
</html>
