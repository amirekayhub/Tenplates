<!doctype html>
<html lang="en">
  <head>
    <!-- Document metadata -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Layout</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://i.postimg.cc/TPxd7803/css.png"
    />

    <!-- Fonts and styles -->
    <link rel="stylesheet" href="font.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body>
    <!-- Mobile layout wrapper -->
    <div class="mobile-layout">
      <!-- App header -->
      <header class="header">
        <div class="header-wrapper"></div>
      </header>

      <!-- Main content container -->
      <main class="main" id="main">
        <div class="main-wrapper">
          <div class="header">
            <div
              class="selected-menu-title"
              contenteditable="true"
              role="textbox"
              aria-label="Rename page"
              spellcheck="false"
            >
              One
            </div>
            <img
              class="menu-toggle-icon"
              src="https://i.postimg.cc/7Zppx0c6/Menu-Toggle-Icon-coco.png"
            />
          </div>
          <div class="page-board">
            <div class="page-board-count">
              <div class="page-board-number">1</div>
            </div>
            <div class="page-board-input">
              <div class="page-board-name">
                <input class="name" type="text" placeholder="Name" />
              </div>
              <div class="page-board-username">
                <span class="username-prefix">@</span>
                <input class="username" type="text" placeholder="Username" />
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Bottom navigation bar -->
      <footer class="footer">
        <div class="footer-wrapper"></div>
      </footer>
    </div>

    <aside class="menu-panel" id="menu-panel" aria-hidden="true"></aside>

    <!-- Desktop / tablet redirect view -->
    <div class="redirect-page">
      <div class="redirect-container">
        <h1 class="redirect-title">error</h1>
        <div class="redirect-text">
          <p class="redirect-subtext">
            This is Currently Unavailable on Tablet and Desktop
          </p>
          <a href="#" class="redirect-cta">View On Mobile</a>
        </div>
      </div>
    </div>

    <!-- Application script -->
    <script src="script.js"></script>
  </body>
</html>
