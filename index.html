<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Header</title>
    <link
      rel="icon"
      type="image/png"
      href="https://i.postimg.cc/TPxd7803/css.png"
    />

    <!-- Fonts -->
    <link rel="stylesheet" href="../font.css" />
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/profiles.css" />
    <link rel="stylesheet" href="css/viisuals.css" />
    <link rel="stylesheet" href="css/ap.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body>
    <!-- Mobile Layout -->
    <div class="mobile-layout">
      <!-- Header -->
      <header class="header">
        <div class="header-wrapper">
          <div class="header-text">
            <div class="header-title">Header</div>
            <img
              class="header-title-badge"
              src="https://i.ibb.co/gMWzggJc/b478195eafd3.png"
            />
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main" id="main"></main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-wrapper">
          <div class="nav-items">
            <div class="nav-item" data-nav="home">
              <img
                class="nav-icon"
                src="https://i.postimg.cc/XNf05SD0/nav-icon-home.png"
              />
              <div class="nav-title">Home</div>
            </div>
            <div class="nav-item" data-nav="profiles">
              <img
                class="nav-icon"
                src="https://i.postimg.cc/vZNRyQDS/nav-icon-profiles.png"
              />
              <div class="nav-title">Profiles</div>
            </div>
            <div class="nav-item" data-nav="visuals">
              <img
                class="nav-icon"
                src="https://i.postimg.cc/cCmjbWVs/nav-icon-visuals.png"
              />
              <div class="nav-title">Visuals</div>
            </div>
            <div class="nav-item" data-nav="ap">
              <img
                class="nav-icon"
                src="https://i.postimg.cc/R0HYzKjk/nav-icon-ap.png"
              />
              <div class="nav-title">A&amp;P</div>
            </div>
            <div class="nav-item" data-nav="store">
              <img
                class="nav-icon"
                src="https://i.postimg.cc/PJ23M4wW/nav-icon-store.png"
              />
              <div class="nav-title">Store</div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Desktop Redirect -->
    <div class="redirect-page">
      <div class="redirect-container">
        <h1 class="redirect-title">504 Error</h1>
        <div class="redirect-text">
          <p class="redirect-subtext">
            This is Currently Unavailable on Tablet and Desktop
          </p>
          <a href="#" class="redirect-cta">View On Mobile</a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
